openapi: 3.1.0
info:
  title: Audio Router P2P Control Plane API
  version: 1.0.0
  description: |
    Formal REST, Server-Sent Events (SSE), and WebSocket control plane specification
    for audio-router-p2p. Provides deterministic matrix routing, audio device and node
    registry, high-frequency telemetry (VU/RMS/clipping/ASRC/FEC/PLC), multi-node room
    orchestration, and backward-compatible adapters.
  contact:
    name: Audio Systems Architecture Team
    url: https://github.com/audio-router-p2p
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Current node control plane

security:
  - BearerAuth: []
  - CookieAuth: []
  - QueryAuth: []

paths:
  # ============================================================================
  # SYSTEM & NODE MANAGEMENT (/api/v1/system)
  # ============================================================================
  /api/v1/system/status:
    get:
      tags:
        - System
      summary: Get system operational health and node summary
      description: Returns node identity, daemon uptime, active stream and route counts, and subsystem health.
      operationId: getSystemStatus
      responses:
        '200':
          description: Operational status snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/system/peers:
    get:
      tags:
        - System
      summary: List discovered mesh peers
      description: Enumerates peer nodes discovered via mDNS, DHT, or static peer configuration.
      operationId: listPeers
      responses:
        '200':
          description: List of discovered peer nodes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeerNode'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - System
      summary: Connect to a remote peer node
      description: Manually initiates connection and session negotiation with an external peer address.
      operationId: connectPeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectPeerRequest'
      responses:
        '201':
          description: Successfully initiated peer handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerNode'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/system/clock-sync:
    get:
      tags:
        - System
      summary: Retrieve clock synchronization telemetry
      description: Queries PTP/NTP distributed clock synchronization offsets and estimation variance across nodes.
      operationId: getClockSync
      responses:
        '200':
          description: Clock synchronization telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockSyncStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================================================
  # AUDIO DEVICE & NODE REGISTRY (/api/v1/devices)
  # ============================================================================
  /api/v1/devices:
    get:
      tags:
        - Devices
      summary: Enumerate audio devices
      description: Lists hardware sound cards, virtual audio interfaces, and loopback sinks/sources available on this host.
      operationId: listDevices
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [all, input, output, virtual]
            default: all
          description: Filter devices by type.
      responses:
        '200':
          description: Collection of available audio devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudioDevice'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/devices/{deviceId}:
    get:
      tags:
        - Devices
      summary: Get device details
      description: Returns configuration, supported sample rates, channel configurations, and runtime gain levels for a device.
      operationId: getDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
      responses:
        '200':
          description: Detailed device state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevice'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Devices
      summary: Update device runtime parameters
      description: Adjusts master volume, mute state, or channel map without tearing down ongoing streams.
      operationId: updateDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Device updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevice'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/devices/virtual:
    post:
      tags:
        - Devices
      summary: Create a virtual loopback device
      description: Allocates a software loopback sink/source device in memory for bridging, DAW routing, or testing.
      operationId: createVirtualDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualDeviceRequest'
      responses:
        '201':
          description: Virtual device created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioDevice'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/devices/virtual/{deviceId}:
    delete:
      tags:
        - Devices
      summary: Tear down a virtual loopback device
      description: Removes an active virtual loopback device and closes associated memory buffers.
      operationId: deleteVirtualDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdParam'
      responses:
        '204':
          description: Virtual device successfully deleted.
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ============================================================================
  # MATRIX ROUTING CONTRACT (/api/v1/routes)
  # ============================================================================
  /api/v1/routes:
    get:
      tags:
        - Routing
      summary: List all active matrix routes
      description: Retrieves all active matrix routing configurations, crosspoint coefficient matrices, and endpoint bindings.
      operationId: listRoutes
      responses:
        '200':
          description: Active route collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatrixRoute'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Routing
      summary: Create and activate a matrix route
      description: Configures an N:M channel routing session from source endpoints to destination endpoints with linear gain matrices.
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: Route created and streaming pipeline established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixRoute'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Route ID collision or resource conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/routes/{routeId}:
    get:
      tags:
        - Routing
      summary: Get matrix route details
      description: Returns configuration, runtime statistics, and current coefficient matrices for a specific route.
      operationId: getRoute
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '200':
          description: Route details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixRoute'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Routing
      summary: Replace matrix route configuration
      description: Completely updates route configuration, re-negotiating audio codecs or formats if channel counts change.
      operationId: replaceRoute
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '200':
          description: Route replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixRoute'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags:
        - Routing
      summary: Live-update matrix coefficients with slew rate smoothing
      description: Modifies crosspoint gains, mutes, or labels without interrupting or restarting the real-time audio stream.
      operationId: patchRoute
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRouteRequest'
      responses:
        '200':
          description: Route updated. Slew interpolator activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixRoute'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Routing
      summary: Stop and delete a matrix route
      description: Smoothly fades down route gain, tears down streamer pipeline, and removes entry from persistent routing table.
      operationId: deleteRoute
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '204':
          description: Route deleted successfully.
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/routes/{routeId}/crosspoint:
    post:
      tags:
        - Routing
      summary: Update single crosspoint gain
      description: Atomically updates the linear gain multiplier for a single (outChannel, inChannel) pair with 20ms slew interpolation.
      operationId: setCrosspointGain
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrosspointGainRequest'
      responses:
        '200':
          description: Crosspoint updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixRoute'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/routes/{routeId}/status:
    get:
      tags:
        - Routing
      summary: Get route playback diagnostics
      description: Returns playback state, ordered human-readable failure reasons, pipeline counters, and activity timestamps for capture, network, and playout.
      operationId: getRouteStatus
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '200':
          description: Route status diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /api/v1/routes/{routeId}/calibrate:
    post:
      tags:
        - Routing
      summary: Calibrate loopback route latency
      description: Injects a probe tone into local route input and measures per-channel delay at playout write. Optionally stores alignment offsets.
      operationId: calibrateRoute
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrateRequest'
      responses:
        '200':
          description: Calibration probe result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrateResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /api/v1/routes/{routeId}/alignment:
    get:
      tags:
        - Routing
      summary: Get per-channel alignment offsets
      description: Returns active or persisted per-channel delay offsets in milliseconds.
      operationId: getRouteAlignment
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      responses:
        '200':
          description: Route alignment offsets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
    put:
      tags:
        - Routing
      summary: Set per-channel alignment offsets
      description: Sets per-channel alignment offsets (0-1000 ms) applied live before the gain matrix.
      operationId: setRouteAlignment
      parameters:
        - $ref: '#/components/parameters/RouteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlignmentRequest'
      responses:
        '200':
          description: Applied sample-quantized alignment offsets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentInfo'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  # ============================================================================
  # ROOM ORCHESTRATION (/api/v1/rooms)
  # ============================================================================
  /api/v1/rooms:
    get:
      tags:
        - Rooms
      summary: List conference audio rooms
      description: Enumerate active mesh rooms, topologies, and member participants.
      operationId: listRooms
      responses:
        '200':
          description: Active rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Rooms
      summary: Create a conference audio room
      description: Creates a distributed audio room with leader election and automatic format harmonization.
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/rooms/{roomId}:
    get:
      tags:
        - Rooms
      summary: Get room details
      description: Returns room state, leader node, members, and active audio layout.
      operationId: getRoom
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: Room details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Rooms
      summary: Close audio room
      description: Disbands room session and disconnects all participating peers.
      operationId: deleteRoom
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '204':
          description: Room disbanded.
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/rooms/{roomId}/join:
    post:
      deprecated: true
      tags:
        - Rooms
      summary: Join local node to audio room (Deprecated)
      description: |
        Deprecated: Audio routes are automatically compiled via bindings and the Audio Flow engine.
        Joins the room, establishes mesh audio peer connections, and engages format downmix/upmix adapters.
      operationId: joinRoom
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: Successfully joined room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/rooms/{roomId}/leave:
    post:
      deprecated: true
      tags:
        - Rooms
      summary: Leave audio room (Deprecated)
      description: |
        Deprecated: Audio routes are automatically compiled via bindings and the Audio Flow engine.
        Disconnects local peer from room session.
      operationId: leaveRoom
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: Successfully left room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/rooms/{roomId}/latency:
    put:
      tags:
        - Rooms
      summary: Set room latency preset
      description: Sets the room latency preset (low, balanced, or reliable), tuning jitter buffer timing limits and FEC protection for all room routes.
      operationId: setRoomLatencyPreset
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomLatencyRequest'
      responses:
        '200':
          description: Updated room details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ============================================================================
  # NETWORK SIMULATOR & HEALTH (/api/v1/network)
  # ============================================================================
  /api/v1/network/sim:
    get:
      tags:
        - Network
      summary: Get network condition simulator profiles
      description: Returns active simulated packet loss, latency, jitter, reorder, duplicate, and bandwidth limits for UDP audio path.
      operationId: getNetworkSim
      responses:
        '200':
          description: Ingress and egress simulation profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimProfiles'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'
    put:
      tags:
        - Network
      summary: Update network condition simulator profiles
      description: Updates simulated packet loss, latency, jitter, reorder, duplicate, and bandwidth limits per direction at runtime.
      operationId: setNetworkSim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimProfiles'
      responses:
        '200':
          description: Updated simulation profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimProfiles'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '501':
          $ref: '#/components/responses/NotImplementedError'

  /api/v1/network/health:
    get:
      tags:
        - Network
      summary: Get cluster network health snapshot
      description: Returns node health score, SWIM discovery membership metrics, clock sync health, peer link grades, and latency matrix.
      operationId: getNetworkHealth
      responses:
        '200':
          description: Network health snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkHealthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================================================
  # CLUSTER OBSERVABILITY (/api/v1/cluster)
  # ============================================================================
  /api/v1/cluster/nodes:
    get:
      tags:
        - Cluster
      summary: Enumerate cluster nodes
      description: Returns summaries for all nodes in the mesh cluster including health grades and metrics.
      operationId: getClusterNodes
      responses:
        '200':
          description: Cluster nodes summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNodesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/cluster/devices:
    get:
      tags:
        - Cluster
      summary: Enumerate cluster-wide audio devices
      description: Lists audio interfaces across all mesh nodes.
      operationId: getClusterDevices
      parameters:
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [all, input, output]
      responses:
        '200':
          description: Cluster audio devices list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDevicesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================================================
  # HIGH-FREQUENCY TELEMETRY (/api/v1/telemetry)
  # ============================================================================
  /api/v1/telemetry/stream-stats:
    get:
      tags:
        - Telemetry
      summary: Query snapshot of stream diagnostics
      description: |
        Returns real-time metrics including FEC recovery counts, PLC concealment events, ASRC
        drift ppm, and jitter buffer histograms.

        The response map is keyed by ROUTE ID (room routes are of the form
        `room-<roomId>-<inDev>-<outDev>`; the per-entry `stream_id` field remains the opaque
        derived hex stream ID). ADR 0034: each entry additively gains optional `health`
        (RouteHealth) and `devices` (RouteDeviceImpact) fields, present only when the
        daemon's ArtifactAggregator is wired, plus always-present `late_packets` /
        `early_packets` on the per-peer `JitterStats`.
      operationId: getStreamStats
      responses:
        '200':
          description: Stream statistics by route ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/StreamStats'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/telemetry/device-artifacts:
    get:
      tags:
        - Telemetry
      summary: Per-physical-device audio artifact health (ADR 0034)
      description: |
        Returns the URN-keyed map of per-device artifact health: 10 s windowed hardware
        XRun counts per direction, lifetime XRun totals, the audibility score (0-100), and
        the 4-tier ArtifactSeverity grade (NONE / MINOR / MAJOR / CRITICAL).

        Hardware XRuns are shared across every route using the device (one physical
        PortAudio stream per device, ref-counted) and are intentionally NOT folded into
        per-route scores. Returns an empty object when the ArtifactAggregator is unwired
        (tests, partial startup).
      operationId: getDeviceArtifacts
      responses:
        '200':
          description: Device artifact health by device URN.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/DeviceHealth'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/telemetry/meters:
    get:
      tags:
        - Telemetry
      summary: Server-Sent Events (SSE) meter stream
      description: |
        Streams real-time audio levels (VU, RMS dBFS, Peak dBFS, clipping indicator, DTX state)
        at 20-50 Hz intervals. Uses non-blocking ring-buffer dispatch. Drops frames on slow consumers
        to protect real-time DSP execution.
      operationId: streamMetersSSE
      parameters:
        - name: rate
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 60
            default: 30
          description: Desired meter push frequency in Hertz (frames/sec).
      responses:
        '200':
          description: Continuous Server-Sent Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: meter
                  data: {"stream_id":"b3f8...","channels":[{"rms_dbfs":-18.4,"peak_dbfs":-6.2,"clipped":false}],"timestamp_ns":1727280000000000000}

        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/telemetry/ws:
    get:
      tags:
        - Telemetry
      summary: Bidirectional WebSocket telemetry and control session
      description: |
        Establishes a low-latency bidirectional WebSocket connection. Server streams binary or JSON
        metering frames at 20-50 Hz and broadcast state changes. Clients can send live matrix gain slew
        commands, crosspoint updates, or mute toggles. Drops frames on lag without exerting backpressure.
      operationId: connectTelemetryWebSocket
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Query parameter authentication token fallback for WebSocket browsers.
      responses:
        '101':
          description: Switching Protocols to WebSocket.
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================================================
  # BACKWARD-COMPATIBILITY ROOT ADAPTERS
  # ============================================================================
  /status:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy system status adapter
      description: Backward-compatible alias for `/api/v1/system/status`.
      responses:
        '200':
          description: Legacy node status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /devices:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy device list adapter
      description: Backward-compatible alias for `/api/v1/devices`.
      responses:
        '200':
          description: Device list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudioDevice'

  /routes:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy route list adapter
      description: Backward-compatible alias for `/api/v1/routes`.
      responses:
        '200':
          description: Route table snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/StreamRoute'
    post:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy create route adapter
      description: Backward-compatible alias for `/api/v1/routes`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRoute'
      responses:
        '201':
          description: Created route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamRoute'

  /peers:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy peers list adapter
      description: Backward-compatible alias for `/api/v1/system/peers`.
      responses:
        '200':
          description: Peers list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeerNode'

  /sync:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy clock sync adapter
      description: Backward-compatible alias for `/api/v1/system/clock-sync`.
      responses:
        '200':
          description: Clock sync info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockSyncStatus'

  /rooms:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy room list adapter
      description: Backward-compatible alias for `/api/v1/rooms`.
      responses:
        '200':
          description: List of rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomInfo'
    post:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy create room adapter
      description: Backward-compatible alias for `/api/v1/rooms`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'

  /rooms/{roomId}/join:
    post:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy room join adapter
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: Joined room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'

  /rooms/{roomId}/leave:
    post:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy room leave adapter
      parameters:
        - $ref: '#/components/parameters/RoomIdParam'
      responses:
        '200':
          description: Left room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'

  /streams/stats:
    get:
      tags:
        - Legacy
      deprecated: true
      summary: Legacy stream stats adapter
      description: Backward-compatible alias for `/api/v1/telemetry/stream-stats`.
      responses:
        '200':
          description: Stream statistics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/StreamStats'

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: "Header Authorization: Bearer <token> or X-Auth-Token: <token>."
    CookieAuth:
      type: apiKey
      in: cookie
      name: audio_session
      description: HTTP-only session cookie for embedded WebUI SPA.
    QueryAuth:
      type: apiKey
      in: query
      name: token
      description: Query parameter token fallback for browser WebSocket and EventSource connections.

  parameters:
    DeviceIdParam:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
      description: Device identifier (integer index string or virtual device GUID).
    RouteIdParam:
      name: routeId
      in: path
      required: true
      schema:
        type: string
      description: Unique matrix route identifier.
    RoomIdParam:
      name: roomId
      in: path
      required: true
      schema:
        type: string
      description: Conference room identifier.

  responses:
    BadRequestError:
      description: Malformed payload, invalid channel index, or out-of-range gain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Target resource (device, route, or room) was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplementedError:
      description: Requested feature or operation is unsupported or uncalibratable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --------------------------------------------------------------------------
    # Common Error
    # --------------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: invalid crosspoint coordinates
        code:
          type: string
          description: Machine-readable error code.
          example: ERR_INVALID_COEFFICIENT
        details:
          type: object
          description: Optional diagnostic metadata.

    # --------------------------------------------------------------------------
    # System Status & Peers
    # --------------------------------------------------------------------------
    SystemStatus:
      type: object
      required:
        - status
        - version
        - uptime_seconds
        - active_routes
        - discovered_peers
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        version:
          type: string
          example: 1.4.0
        uptime_seconds:
          type: number
          example: 3600.5
        active_routes:
          type: integer
          example: 4
        discovered_peers:
          type: integer
          example: 3
        clock_sync_locked:
          type: boolean
          example: true

    PeerNode:
      type: object
      required:
        - id
        - addr
        - status
      properties:
        id:
          type: string
          example: node-nyc-edge-01
        addr:
          type: string
          example: 192.168.1.120:7001
        status:
          type: string
          enum: [connected, negotiating, disconnected]
          example: connected
        rtt_ms:
          type: number
          example: 4.2
        last_seen:
          type: string
          format: date-time

    ConnectPeerRequest:
      type: object
      required:
        - addr
      properties:
        addr:
          type: string
          example: 10.0.0.50:7001
        tls_fingerprint:
          type: string
          description: Expected DTLS certificate SHA-256 fingerprint for verification.

    ClockSyncStatus:
      type: object
      required:
        - locked
        - offset_ns
        - drift_ppm
      properties:
        locked:
          type: boolean
          example: true
        offset_ns:
          type: integer
          description: Estimated wall-clock offset relative to mesh clock master in nanoseconds.
          example: -12500
        drift_ppm:
          type: number
          description: Frequency offset in parts per million.
          example: -2.35
        source:
          type: string
          enum: [ptp, ntp, internal]
          example: ptp

    # --------------------------------------------------------------------------
    # Audio Devices
    # --------------------------------------------------------------------------
    AudioDevice:
      type: object
      required:
        - id
        - name
        - max_input
        - max_output
        - default_sample_rate
        - is_virtual
      properties:
        id:
          type: string
          example: "0"
        name:
          type: string
          example: "Built-in Microphone"
        max_input:
          type: integer
          example: 2
        max_output:
          type: integer
          example: 0
        default_sample_rate:
          type: number
          example: 48000
        is_virtual:
          type: boolean
          example: false
        volume:
          type: number
          minimum: 0.0
          maximum: 2.0
          default: 1.0
          example: 1.0
        muted:
          type: boolean
          default: false
        supported_layouts:
          type: array
          items:
            type: string
            enum: [mono, stereo, quad, "5.1", "7.1"]
          example: [mono, stereo]

    UpdateDeviceRequest:
      type: object
      properties:
        volume:
          type: number
          minimum: 0.0
          maximum: 2.0
          example: 0.8
        muted:
          type: boolean
          example: false

    CreateVirtualDeviceRequest:
      type: object
      required:
        - name
        - direction
        - channels
        - sample_rate
      properties:
        name:
          type: string
          example: "Loopback-Bus-A"
        direction:
          type: string
          enum: [input, output, duplex]
          example: duplex
        channels:
          type: integer
          enum: [1, 2, 4, 6, 8]
          example: 2
        sample_rate:
          type: integer
          enum: [44100, 48000, 96000]
          default: 48000
        buffer_size_frames:
          type: integer
          default: 480
          example: 480

    # --------------------------------------------------------------------------
    # Matrix Routing
    # --------------------------------------------------------------------------
    MatrixEndpoint:
      type: object
      required:
        - node_id
        - device_id
        - channels
      properties:
        node_id:
          type: string
          description: Host node identifier (or "local").
          example: local
        device_id:
          type: string
          example: "0"
        layout:
          type: string
          enum: [mono, stereo, quad, "5.1", "7.1", custom]
          example: stereo
        channels:
          type: array
          items:
            type: integer
          description: Zero-based channel index mapping.
          example: [0, 1]

    MatrixRoute:
      type: object
      required:
        - id
        - source
        - destination
        - coefficients
        - in_channels
        - out_channels
        - slew_ms
        - state
      properties:
        id:
          type: string
          example: route-mix-master
        name:
          type: string
          example: "Studio Monitor Feed"
        source:
          $ref: '#/components/schemas/MatrixEndpoint'
        destination:
          $ref: '#/components/schemas/MatrixEndpoint'
        in_channels:
          type: integer
          description: Number of source input channels (M).
          example: 2
        out_channels:
          type: integer
          description: Number of destination output channels (N).
          example: 2
        coefficients:
          type: array
          items:
            type: number
          description: |
            Row-major flat gain matrix of size out_channels * in_channels.
            Each coefficient represents linear gain multiplier [0.0 .. 2.0] (-inf to +6 dB).
            Index calculation: coefficients[out_ch * in_channels + in_ch].
          example: [1.0, 0.0, 0.0, 1.0]
        slew_ms:
          type: number
          default: 20.0
          description: Linear gain ramp slewing duration in milliseconds to prevent audio pops.
          example: 20.0
        muted:
          type: boolean
          default: false
        state:
          type: string
          enum: [active, slewing, paused, error]
          example: active
        channel_delays_ms:
          type: array
          items:
            type: number
          description: Per-channel delay offsets in milliseconds applied before matrix mixing.
          example: [0.0, 15.5]

    CreateRouteRequest:
      type: object
      required:
        - source
        - destination
      properties:
        id:
          type: string
          description: Unique route identifier. Generated if omitted.
          example: route-stereo-pair
        name:
          type: string
          example: "Master to Broadcast Out"
        source:
          $ref: '#/components/schemas/MatrixEndpoint'
        destination:
          $ref: '#/components/schemas/MatrixEndpoint'
        coefficients:
          type: array
          items:
            type: number
          description: Row-major gain coefficients. Defaults to identity / standard downmix matrix if omitted.
          example: [1.0, 0.0, 0.0, 1.0]
        slew_ms:
          type: number
          default: 20.0
          example: 20.0

    PatchRouteRequest:
      type: object
      properties:
        name:
          type: string
        coefficients:
          type: array
          items:
            type: number
          description: Updated row-major gain matrix. Slewed over slew_ms without audio glitch.
        slew_ms:
          type: number
          description: Override slew rate transition time in ms.
          example: 20.0
        muted:
          type: boolean

    CrosspointGainRequest:
      type: object
      required:
        - out_channel
        - in_channel
        - gain
      properties:
        out_channel:
          type: integer
          minimum: 0
          example: 0
        in_channel:
          type: integer
          minimum: 0
          example: 1
        gain:
          type: number
          minimum: 0.0
          maximum: 2.0
          example: 0.7071
        slew_ms:
          type: number
          default: 20.0
          example: 20.0

    RoutePeerStatus:
      type: object
      required:
        - address
        - role
        - packets_sent
        - packets_lost
        - fec_recovered
        - jitter_depth_frames
        - underruns
      properties:
        peer_id:
          type: string
          example: node-b
        address:
          type: string
          example: 10.0.0.2:45678
        role:
          type: string
          enum: [send, receive, sendrecv]
          example: receive
        last_send:
          type: string
          format: date-time
        last_recv:
          type: string
          format: date-time
        last_contact:
          type: string
          format: date-time
        last_send_error:
          type: string
        packets_sent:
          type: integer
          example: 1200
        packets_lost:
          type: integer
          example: 3
        fec_recovered:
          type: integer
          example: 2
        jitter_depth_frames:
          type: integer
          example: 12
        underruns:
          type: integer
          example: 0

    RouteStatus:
      type: object
      required:
        - route_id
        - direction
        - playing
        - summary
        - packets_received
        - underruns
        - overruns
        - jitter_depth_frames
        - capture_overflows
        - output_underflows
      properties:
        route_id:
          type: string
          example: local-matrix-1
        direction:
          type: string
          enum: [send, receive, sendrecv]
          example: sendrecv
        playing:
          type: boolean
          example: true
        summary:
          type: string
          example: playing
        reasons:
          type: array
          items:
            type: string
          example: ["no audio received from any peer yet"]
        peers:
          type: array
          items:
            $ref: '#/components/schemas/RoutePeerStatus'
        packets_received:
          type: integer
          example: 15400
        underruns:
          type: integer
          example: 0
        overruns:
          type: integer
          example: 0
        jitter_depth_frames:
          type: integer
          example: 60
        dtx_state:
          type: string
          example: active
        capture_overflows:
          type: integer
          example: 0
        output_underflows:
          type: integer
          example: 0
        last_input:
          type: string
          format: date-time
        last_playout:
          type: string
          format: date-time

    CalibrateRequest:
      type: object
      properties:
        freq_hz:
          type: number
          minimum: 100
          maximum: 20000
          default: 4200
          example: 4200
        amplitude:
          type: integer
          minimum: 1000
          maximum: 32000
          default: 16000
          example: 16000
        duration_ms:
          type: integer
          minimum: 100
          maximum: 5000
          default: 600
          example: 600
        apply:
          type: boolean
          default: false
          example: true

    CalibrateResult:
      type: object
      required:
        - route_id
        - detected
        - freq_hz
        - duration_ms
      properties:
        route_id:
          type: string
          example: local-1
        detected:
          type: boolean
          example: true
        delay_ms:
          type: number
          example: 12.5
        channel_delays_ms:
          type: array
          items:
            type: number
          example: [10.2, 14.8]
        offsets_ms:
          type: array
          items:
            type: number
          example: [4.6, 0.0]
        applied:
          type: boolean
          example: true
        freq_hz:
          type: number
          example: 4200
        duration_ms:
          type: integer
          example: 600
        note:
          type: string
          example: "probe detected on 2 of 2 channels"

    UpdateAlignmentRequest:
      type: object
      required:
        - offsets_ms
      properties:
        offsets_ms:
          type: array
          items:
            type: number
            minimum: 0
            maximum: 1000
          example: [0.0, 15.0]

    AlignmentInfo:
      type: object
      required:
        - route_id
        - offsets_ms
      properties:
        route_id:
          type: string
          example: local-1
        offsets_ms:
          type: array
          items:
            type: number
          example: [0.0, 15.0]

    # --------------------------------------------------------------------------
    # Room Management
    # --------------------------------------------------------------------------
    RoomInfo:
      type: object
      required:
        - id
        - name
        - state
      properties:
        id:
          type: string
          example: room-control-room-a
        name:
          type: string
          example: "Live Control Room"
        leader:
          type: string
          example: node-nyc-master
        state:
          type: string
          enum: [idle, active, degraded]
          example: active
        members:
          type: array
          items:
            type: string
          example: ["node-nyc-master", "node-lon-monitor", "node-fra-backup"]
        latency_preset:
          type: string
          enum: [low, balanced, reliable]
          default: balanced
          example: low
        inputs:
          type: array
          items:
            type: string
          example: ["hw:0"]
        outputs:
          type: array
          items:
            type: string
          example: ["hw:1"]
        synced:
          type: boolean
          default: false
          example: true
        input_gains:
          type: object
          additionalProperties:
            type: number
        output_gains:
          type: object
          additionalProperties:
            type: number

    UpdateRoomLatencyRequest:
      type: object
      required:
        - preset
      properties:
        preset:
          type: string
          enum: [low, balanced, reliable]
          example: low

    CreateRoomRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: room-broadcast-stage
        name:
          type: string
          example: "Broadcast Stage"

    # --------------------------------------------------------------------------
    # Telemetry & Diagnostics
    # --------------------------------------------------------------------------
    ChannelMeter:
      type: object
      required:
        - channel
        - rms_dbfs
        - peak_dbfs
        - clipped
      properties:
        channel:
          type: integer
          example: 0
        rms_dbfs:
          type: number
          format: float
          description: Root-Mean-Square loudness in decibels relative to Full Scale.
          example: -16.42
        peak_dbfs:
          type: number
          format: float
          description: True peak amplitude in decibels relative to Full Scale.
          example: -3.15
        clipped:
          type: boolean
          description: True if sample reached digital ceiling (-0.0 dBFS).
          example: false

    MeterFrame:
      type: object
      required:
        - stream_id
        - timestamp_ns
        - channels
        - dtx_state
      properties:
        stream_id:
          type: string
          example: 9b1deb4d3b7d4bad9bdd2b0d7b3dcb6d
        timestamp_ns:
          type: integer
          example: 1727280000000000000
        dtx_state:
          type: string
          enum: [Active, Hangover, Suppressed]
          example: Active
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelMeter'

    JitterStats:
      type: object
      required:
        - current_depth_frames
        - target_depth_frames
        - underruns
        - overruns
        - late_packets
        - early_packets
      properties:
        current_depth_frames:
          type: integer
          example: 3
        target_depth_frames:
          type: integer
          example: 3
        underruns:
          type: integer
          example: 0
        overruns:
          type: integer
          example: 0
        late_packets:
          type: integer
          description: ADR 0034 — always present (0 when absent). Late-arriving packets dropped by the jitter buffer.
          example: 2
        early_packets:
          type: integer
          description: ADR 0034 — always present (0 when absent). Retained for backward compatibility (no increment site).
          example: 0
        jitter_ms:
          type: number
          example: 1.25

    FECStats:
      type: object
      required:
        - group_size_k
        - parity_packets_sent_total
        - parity_packets_received_total
        - packets_recovered_total
        - unrecoverable_groups_total
      properties:
        group_size_k:
          type: integer
          example: 4
        parity_packets_sent_total:
          type: integer
          example: 2450
        parity_packets_received_total:
          type: integer
          example: 2448
        packets_recovered_total:
          type: integer
          example: 42
        unrecoverable_groups_total:
          type: integer
          example: 2

    PLCStats:
      type: object
      required:
        - concealed_frames_total
        - pitch_detected_frames_total
        - noise_extrapolated_frames_total
        - silence_decay_events_total
      properties:
        concealed_frames_total:
          type: integer
          example: 12
        pitch_detected_frames_total:
          type: integer
          example: 11
        noise_extrapolated_frames_total:
          type: integer
          example: 1
        silence_decay_events_total:
          type: integer
          example: 0

    ASRCStats:
      type: object
      required:
        - nominal_rate_hz
        - resample_ratio
        - drift_ppm
        - samples_adjusted_total
      properties:
        nominal_rate_hz:
          type: integer
          example: 48000
        smoothed_watermark_frames:
          type: number
          example: 3.01
        target_watermark_frames:
          type: number
          example: 3.00
        drift_ppm:
          type: number
          example: -14.2
        resample_ratio:
          type: number
          example: 0.9999858
        samples_adjusted_total:
          type: integer
          example: 128

    StreamStats:
      type: object
      required:
        - stream_id
        - packets_sent
        - packets_received
        - underruns
        - overruns
        - fec
        - plc
        - asrc
      properties:
        stream_id:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        packets_sent:
          type: integer
          example: 15400
        packets_received:
          type: integer
          example: 15392
        underruns:
          type: integer
          example: 0
        overruns:
          type: integer
          example: 0
        late_packets:
          type: integer
          example: 2
        early_packets:
          type: integer
          example: 0
        dtx_state:
          type: string
          example: Active
        dtx_packets_suppressed_total:
          type: integer
          example: 410
        rms_dbfs:
          type: number
          example: -18.2
        peak_dbfs:
          type: number
          example: -5.4
        fec:
          $ref: '#/components/schemas/FECStats'
        plc:
          $ref: '#/components/schemas/PLCStats'
        asrc:
          $ref: '#/components/schemas/ASRCStats'
        peers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JitterStats'
          description: Per-remote-peer jitter and reception statistics.
        health:
          $ref: '#/components/schemas/RouteHealth'
          description: ADR 0034 — optional per-route artifact health over the 10 s window. Omitted when the ArtifactAggregator is unwired.
        devices:
          $ref: '#/components/schemas/RouteDeviceImpact'
          description: ADR 0034 — optional overlay of the route's source/destination device artifact health (shared XRuns are never folded into the route score). Omitted when the ArtifactAggregator is unwired.

    # --------------------------------------------------------------------------
    # Audio Artifact Health (ADR 0034)
    #
    # ArtifactSeverity is a 4-tier audibility grade (NONE / MINOR / MAJOR /
    # CRITICAL) and is deliberately DISTINCT from the 5-tier node link-quality
    # grade (EXCELLENT / GOOD / FAIR / POOR / CRITICAL). No cross-mapping.
    # --------------------------------------------------------------------------
    ArtifactRates:
      type: object
      required:
        - underrun_per_s
        - overrun_per_s
        - xrun_per_s
        - ring_drop_per_s
      properties:
        underrun_per_s:
          type: number
          description: Jitter underrun events per second over the actual window span (ramp-up safe).
          example: 0.1
        overrun_per_s:
          type: number
          description: Jitter overrun events per second over the window.
          example: 0.0
        xrun_per_s:
          type: number
          description: Device-shared hardware XRun rate for the route's own devices (rendered on the distinct "shared device" line).
          example: 0.1
        ring_drop_per_s:
          type: number
          description: Capture/playback ring drop events per second over the window.
          example: 0.0

    PeerArtifactHealth:
      type: object
      required:
        - underruns
        - overruns
        - late_packets
      properties:
        underruns:
          type: integer
          example: 1
        overruns:
          type: integer
          example: 0
        late_packets:
          type: integer
          example: 0

    RouteHealth:
      type: object
      required:
        - score
        - severity
        - window_s
        - underruns
        - overruns
        - ring_drops
        - plc_concealed
        - fec_unrecoverable
        - packets_lost
        - fec_recovered
        - playout_gaps
        - rates
        - ghost
        - peers
      properties:
        score:
          type: number
          description: Audibility-based score 0-100 (multiplicative coefficients over the 10 s window; route-scoped counters only).
          example: 80
        severity:
          type: string
          description: "4-tier ArtifactSeverity: NONE (score >= 90), MINOR (>= 60), MAJOR (>= 30), CRITICAL (< 30)."
          enum: [NONE, MINOR, MAJOR, CRITICAL]
          example: MINOR
        window_s:
          type: integer
          description: Aggregation window length in seconds.
          example: 10
        underruns:
          type: integer
          description: Windowed jitter buffer underrun events.
          example: 1
        overruns:
          type: integer
          description: Windowed jitter buffer overrun events.
          example: 0
        ring_drops:
          type: integer
          description: Windowed capture/playback ring drop events.
          example: 0
        plc_concealed:
          type: integer
          description: Windowed PLC-concealed frames.
          example: 10
        fec_unrecoverable:
          type: integer
          description: Windowed FEC-unrecoverable groups.
          example: 0
        packets_lost:
          type: integer
          description: Windowed lost packets.
          example: 0
        fec_recovered:
          type: integer
          description: Windowed FEC-recovered packets. Informational only (proof FEC is working; no scoring weight).
          example: 2
        playout_gaps:
          type: integer
          description: Windowed playout gaps. Informational only (not scored; pre-roll inflates it).
          example: 0
        rates:
          $ref: '#/components/schemas/ArtifactRates'
        ghost:
          type: boolean
          description: True when the route's device is quarantined (GHOST); severity may read NONE, which is correct.
          example: false
        peers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PeerArtifactHealth'
          description: Per-remote-peer windowed artifact triple (underruns / overruns / late_packets) for the "worst peer" column.
          example:
            node-audio-02:
              underruns: 1
              overruns: 0
              late_packets: 0

    DeviceDirArtifacts:
      type: object
      required:
        - xrun_window
        - xrun_total
      properties:
        xrun_window:
          type: integer
          description: Hardware XRuns in the 10 s window for this direction.
          example: 1
        xrun_total:
          type: integer
          description: Device-lifetime hardware XRuns for this direction (monotonic across stream swaps).
          example: 12

    DeviceHealth:
      type: object
      required:
        - urn
        - ghost
        - score
        - severity
      properties:
        urn:
          type: string
          description: Canonical device URN (the map key).
          example: alsa://hw:1,0
        ghost:
          type: boolean
          description: True when the device is quarantined (GHOST).
          example: false
        score:
          type: number
          description: Device audibility score 0-100 (C_xrun(input) * C_xrun(output); a missing direction contributes 1.0).
          example: 70
        severity:
          type: string
          description: 4-tier ArtifactSeverity (same mapping as RouteHealth).
          enum: [NONE, MINOR, MAJOR, CRITICAL]
          example: MINOR
        input:
          $ref: '#/components/schemas/DeviceDirArtifacts'
          description: Present only when the device has an active input direction.
        output:
          $ref: '#/components/schemas/DeviceDirArtifacts'
          description: Present only when the device has an active output direction.

    RouteDeviceImpact:
      type: object
      properties:
        input:
          $ref: '#/components/schemas/DeviceHealth'
          description: Artifact health of the route's source device (omitted when absent from the snapshot).
        output:
          $ref: '#/components/schemas/DeviceHealth'
          description: Artifact health of the route's destination device (omitted when absent from the snapshot).

    StreamLinkStats:
      type: object
      required:
        - stream_id
        - packets_sent
        - packets_received
        - packets_lost
        - loss_ratio
        - effective_kbps
        - jitter_depth_frames
        - jitter_target_delay_ms
        - underruns
        - overruns
        - late_packets
        - early_packets
        - fec_recovered
        - plc_concealed
      description: |
        Per-stream link statistics as carried by `GET /api/v1/network/health`
        (streams keyed by opaque hex stream ID). ADR 0034 additively adds
        always-present `late_packets` / `early_packets`; there is deliberately
        NO RouteHealth/DeviceHealth mirror on this surface (hex stream IDs
        cannot carry route or device identity).
      properties:
        stream_id:
          type: string
          example: 9f2ab6c1e4d38a5b0c7d1f6e2a9b4c0d
        peer_id:
          type: string
          example: node-audio-02
        packets_sent:
          type: integer
          example: 145020
        packets_received:
          type: integer
          example: 145018
        packets_lost:
          type: integer
          example: 0
        loss_ratio:
          type: number
          example: 0.00001
        effective_kbps:
          type: number
          example: 482.5
        jitter_depth_frames:
          type: integer
          example: 4
        jitter_target_delay_ms:
          type: number
          example: 4.2
        underruns:
          type: integer
          example: 1
        overruns:
          type: integer
          example: 0
        late_packets:
          type: integer
          description: ADR 0034 — always present (0 when absent).
          example: 0
        early_packets:
          type: integer
          description: ADR 0034 — always present (0 when absent; dead counter kept for backward compatibility).
          example: 0
        fec_recovered:
          type: integer
          example: 2
        plc_concealed:
          type: integer
          example: 0

    # --------------------------------------------------------------------------
    # Network Condition Simulator
    # --------------------------------------------------------------------------
    SimProfile:
      type: object
      required:
        - enabled
        - loss_pct
        - latency_ms
        - jitter_ms
        - reorder_pct
        - duplicate_pct
        - bandwidth_kbps
      properties:
        enabled:
          type: boolean
          example: true
        loss_pct:
          type: number
          minimum: 0
          maximum: 100
          example: 10.0
        latency_ms:
          type: number
          minimum: 0
          example: 25.0
        jitter_ms:
          type: number
          minimum: 0
          example: 15.0
        reorder_pct:
          type: number
          minimum: 0
          maximum: 100
          example: 5.0
        duplicate_pct:
          type: number
          minimum: 0
          maximum: 100
          example: 2.0
        bandwidth_kbps:
          type: number
          minimum: 0
          description: Sustained rate limit in kbps (0 = unlimited).
          example: 1024.0

    SimProfiles:
      type: object
      required:
        - in
        - out
      properties:
        in:
          $ref: '#/components/schemas/SimProfile'
        out:
          $ref: '#/components/schemas/SimProfile'

